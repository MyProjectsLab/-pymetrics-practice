<!doctype html><meta charset="utf-8"><title>M6-C local evidence helper</title><h1>M6-C local evidence helper</h1><p>Test-only loopback origin. Production assets are unchanged. Imported state is an accepted historical fixture, not a new timed run.</p><button id="seed">Load accepted historical fixture</button><button id="dump">Download current raw local records</button><a href="/">Open unchanged app</a><pre id="status"></pre><script>
const opening=()=>new Promise((resolve,reject)=>{const r=indexedDB.open('assessment-practice-stop',1);r.onupgradeneeded=()=>{r.result.createObjectStore('installation');r.result.createObjectStore('activity',{keyPath:'key'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
seed.onclick=async()=>{const state=await (await fetch('/m6-c-seed.json')).json();const db=await opening();const tx=db.transaction('installation','readwrite');tx.objectStore('installation').put(state,'stop');tx.oncomplete=()=>{db.close();document.getElementById('status').textContent='Historical fixture loaded. No timed run was performed.'}};
dump.onclick=async()=>{const db=await opening();const tx=db.transaction(['installation','activity'],'readonly');const a=tx.objectStore('installation').getAll();const k=tx.objectStore('installation').getAllKeys();const b=tx.objectStore('activity').getAll();tx.oncomplete=()=>{const raw=JSON.stringify({installation:a.result,keys:k.result,activity:b.result},null,2);const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));link.download='m6-c-native-records.json';link.click();document.getElementById('status').textContent=raw;db.close()}};
</script>
