<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Behavioral Games Practice</title>
<style>
:root{--ink:#1c1c1e;--mut:#6b7280;--line:#e5e7eb;--acc:#2563eb;--good:#16a34a;--bad:#dc2626;--card:#ffffff;--bg:#f6f7f9}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);max-width:780px;margin:0 auto;padding:0 16px 60px;line-height:1.5}
.hero{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:0 0 20px 20px;padding:26px 22px;margin:0 -16px 18px}
.hero h1{margin:0 0 6px;font-size:26px}
.hero p{margin:4px 0;opacity:.92;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 2px 12px rgba(0,0,0,.06)}
button{font-size:17px;padding:13px 20px;margin:6px;border-radius:12px;border:1px solid #c9ccd1;background:#fff;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .06s,background .15s}
button:hover{background:#f1f5f9}
button:active{transform:scale(.97);background:#e8edf3}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.primary:hover{background:#1d4ed8}
.big{font-size:52px;text-align:center;margin:26px 0}
.small{color:var(--mut);font-size:14px}
.measure{color:#4b5563;font-size:14px;font-style:italic;background:#f1f5f9;border-radius:8px;padding:8px 12px}
.hidden{display:none}
.progress{height:8px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin:12px 0 20px}
.progress>div{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);width:0%;transition:width .4s}
.timerbar{height:6px;background:#eee;border-radius:4px;margin-top:12px;overflow:hidden}
.timerbar>div{height:100%;background:var(--acc);width:100%;transition:width 1s linear}
input[type=number]{font-size:22px;width:100px;padding:10px;border-radius:10px;border:1px solid #c9ccd1}
input[type=range]{width:100%}
.resultbox{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:#fafbfc}
.tipbox{border-left:4px solid var(--acc);padding:10px 14px;margin:12px 0;background:#eff6ff;border-radius:0 10px 10px 0}
.warnbox{border-left:4px solid #d97706;padding:10px 14px;margin:12px 0;background:#fffbeb;border-radius:0 10px 10px 0}
.traitbar{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin:6px 0}
.traitbar>div{height:100%;border-radius:6px}
.tapzone{display:flex;align-items:center;justify-content:center;min-height:190px;border-radius:14px;user-select:none;-webkit-user-select:none;touch-action:manipulation;background:#f8fafc;border:1px dashed #cbd5e1}
.indgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.indgrid button{text-align:left;padding:14px}
.indgrid b{display:block}
.indgrid span{font-size:13px;color:var(--mut)}
.balloon{width:90px;height:110px;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;margin:10px auto;position:relative;transition:width .18s,height .18s;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12)}
.balloon::after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);border:7px solid transparent}
.face{width:150px;height:150px;border-radius:50%;background:#fde68a;margin:14px auto;position:relative;border:3px solid #d97706}
.face .eye{position:absolute;top:44px;width:16px;height:16px;border-radius:50%;background:#1c1c1e}
.face .mouth{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;height:8px;border-radius:6px;background:#1c1c1e}
.deck{display:inline-block;width:110px;height:150px;border-radius:12px;margin:8px;color:#fff;font-weight:700;font-size:20px;cursor:pointer;border:none}
.deck small{display:block;font-size:12px;font-weight:400;opacity:.85}
@media (max-width:480px){
 button{font-size:19px;padding:15px 22px}
 .big{font-size:42px}
 .indgrid{grid-template-columns:1fr}
 .hero h1{font-size:22px}
}
</style>
</head>
<body>
<div class="hero">
<h1>🎮 Behavioral Games Practice</h1>
<p>An independent practice simulation inspired by game-based hiring assessments.<br>It is <b>not</b> Harver/Pymetrics and does not reproduce their scoring.</p>
</div>
<div class="progress"><div id="bar"></div></div>
<div id="app" class="card"></div>

<script>
/* ============ data ============ */
const CATS={
 attention:{name:'Attention',work:'staying focused on details without getting distracted'},
 decision:{name:'Decision Making',work:'making sound calls with incomplete information'},
 effort:{name:'Effort',work:'persisting and pushing for high standards'},
 emotion:{name:'Emotion',work:'reading people and keeping composure'},
 fairness:{name:'Fairness',work:'valuing equitable outcomes'},
 focus:{name:'Focus',work:'concentrating amid competing demands'},
 generosity:{name:'Generosity',work:'sharing credit and resources with others'},
 learning:{name:'Learning',work:'adapting quickly from experience'},
 risk:{name:'Risk Tolerance',work:'taking smart risks under uncertainty'}
};
const CATSRC={attention:'Games 5 · 7 · 8',decision:'Games 2 · 6 · 10',effort:'Games 5 · 6',emotion:'Game 12',fairness:'Games 3 · 4',focus:'Games 7 · 9',generosity:'Games 3 · 4',learning:'Game 11',risk:'Games 1 · 11'};
const GNAMES={1:'Balloons',2:'Tower',3:'Money Exchange',4:'Sharing',5:'Keypress',6:'Easy or Hard',7:'Digits',8:'Stop',9:'Arrows',10:'Lengths',11:'Cards',12:'Faces'};
const EXPECT={1:180,2:150,3:60,4:45,5:90,6:120,7:150,8:90,9:180,10:120,11:150,12:240};
/* Theoretical industry profiles — our inference for practice framing, NOT Pymetrics' models. */
const INDUSTRIES={
 finance:{name:'Finance',desc:'Funds, asset management, PE',w:{attention:1,decision:1,effort:.8,emotion:.7,fairness:.5,focus:1,generosity:.5,learning:.9,risk:.9}},
 consulting:{name:'Consulting',desc:'Strategy & advisory',w:{attention:.9,decision:1,effort:.9,emotion:.6,fairness:.6,focus:.8,generosity:.9,learning:1,risk:.6}},
 tech:{name:'Tech & Engineering',desc:'Software, product, data',w:{attention:.9,decision:1,effort:.7,emotion:.5,fairness:.5,focus:1,generosity:.5,learning:1,risk:.6}},
 sales:{name:'Sales & Trading',desc:'Client-facing, markets',w:{attention:.7,decision:.7,effort:1,emotion:.9,fairness:.6,focus:.7,generosity:1,learning:.7,risk:1}},
 general:{name:'General',desc:'Balanced view',w:{attention:1,decision:1,effort:1,emotion:1,fairness:1,focus:1,generosity:1,learning:1,risk:1}}
};
let industry='finance';

/* ============ state ============ */
const app=document.getElementById('app'), bar=document.getElementById('bar');
let stage=0;
let T={}; // trait inputs per game
let timeLog={}; // per-game timing: timeLog[gameN]={start,end}
function setProgress(p){bar.style.width=p+"%"}
function next(){
 const now=Date.now();
 if(stage>=1&&stage<=12){timeLog[stage]=timeLog[stage]||{};timeLog[stage].end=now}
 stage++;
 const fns=[null,balloonsIntro,towerIntro,money1Intro,money2Intro,keypressIntro,easyHardIntro,digitsIntro,stopIntro,arrowsIntro,lengthsIntro,cardsIntro,facesIntro];
 if(stage<=12){timeLog[stage]={start:now};fns[stage]()} else summary();
}
function fmtT(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

/* ============ Game 1 — Balloons (risk) ============
   39 balloons, $0.05/pump, 3 colours with different pop odds (hidden). */
let bRound=0,bVal=0,bThresh=0,bBank=0,bPumps=[],bPops=0,bT0=0,bTimer=null;
function bTick(){const el=document.getElementById('btime');if(!el)return;const s=Math.floor((Date.now()-bT0)/1000);el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
const BCOL={red:{c:'#ef4444',min:4,max:11},blue:{c:'#3b82f6',min:6,max:16},green:{c:'#22c55e',min:9,max:24}};
let bCol='red';
function balloonsIntro(){
 setProgress(3);
 app.innerHTML=`<h2>Game 1 — Balloons</h2><p class="measure">Traits: <b>Risk Tolerance</b> — ${CATS.risk.work}.</p>
 <p>Each pump adds <b>$0.05</b>. Bank any time to keep it. If the balloon pops, you get $0 for that balloon. Balloons come in colours — pop points vary.</p>
 <p>39 balloons, about 3 minutes.</p><button class="primary" onclick="newBalloon()">Begin</button>`;
}
function newBalloon(){
 if(bRound>=39){if(bTimer){clearInterval(bTimer);bTimer=null}T.balloons={pumps:bPumps,pops:bPops};next();return}
 bRound++;bVal=0;
 if(bRound===1){bT0=Date.now();if(bTimer)clearInterval(bTimer);bTimer=setInterval(bTick,500)}
 const cols=Object.keys(BCOL);bCol=cols[Math.floor(Math.random()*3)];
 const r=BCOL[bCol];bThresh=r.min+Math.floor(Math.random()*(r.max-r.min+1));
 renderBalloon(false);
}
function renderBalloon(popped){
 const size=90+Math.min(70,Math.round(bVal/0.05)*2.2);
 const col=BCOL[bCol].c;
 app.innerHTML=`<h2>Balloon ${bRound}/39</h2>
 <p class="small" style="margin-top:-8px">⏱ <span id="btime">0:00</span> elapsed</p>
 <div class="balloon" style="width:${size}px;height:${size*1.22}px;background:${col}"></div>
 ${popped?'<div class="big">💥</div>':''}
 <p style="text-align:center">This balloon: <b>$${bVal.toFixed(2)}</b> · Banked: <b>$${bBank.toFixed(2)}</b></p>
 ${popped?`<p style="text-align:center">It popped.</p><div style="text-align:center"><button class="primary" onclick="newBalloon()">Next balloon</button></div>`
 :`<div style="text-align:center"><button onclick="pump()">PUMP (+$0.05)</button><button class="primary" onclick="bank()">BANK</button></div>`}`;
}
function pump(){
 bVal+=0.05;
 if(Math.round(bVal/0.05)>=bThresh){
  bPumps.push(Math.round(bVal/0.05));bPops++;
  renderBalloon(true);
 } else renderBalloon(false);
}
function bank(){
 bPumps.push(Math.round(bVal/0.05));bBank+=bVal;
 newBalloon();
}

/* ============ Game 2 — Tower of Hanoi (planning) ============
   Scored on fewest moves AND time to first move. */
let twState=null,twMoves=0,twSel=-1,twOpt=0,twFirstT=0,twStartT=0,twIdx=0,twRes=[];
const TW_PUZ=[
 {start:[[3,2,1],[],[]],target:[[],[],[3,2,1]]},
 {start:[[3,2],[],[1]],target:[[],[3,2,1],[]]}
];
function twKey(s){return s.map(p=>p.join(',')).join('|')}
function twOptimal(start,target){
 const tk=twKey(target),q=[[start.map(p=>p.slice()),0]],seen=new Set([twKey(start)]);
 while(q.length){const cur=q.shift(),s=cur[0],d=cur[1];
  if(twKey(s)===tk)return d;
  for(let i=0;i<3;i++)for(let j=0;j<3;j++){if(i===j||!s[i].length)continue;
   const top=s[i][s[i].length-1];
   if(s[j].length&&s[j][s[j].length-1]<top)continue;
   const ns=s.map(p=>p.slice());ns[i].pop();ns[j].push(top);
   const k=twKey(ns);if(!seen.has(k)){seen.add(k);q.push([ns,d+1])}}}
 return 99;
}
function towerIntro(){
 setProgress(11);
 app.innerHTML=`<h2>Game 2 — Tower</h2><p class="measure">Traits: <b>Decision Making, Focus</b> — planning ahead and sequencing moves.</p>
 <p>Rearrange the discs to match the <b>target</b> under each peg. Tap a peg to lift its top disc, then tap another peg to place it. A bigger disc can never sit on a smaller one.</p>
 <p class="small">Tip from candidates: think before your <b>first</b> move — it is scored too.</p>
 <p>2 puzzles.</p><button class="primary" onclick="twPuzzle()">Begin</button>`;
}
function twPuzzle(){
 if(twIdx>=TW_PUZ.length){T.tower=twRes;next();return}
 const P=TW_PUZ[twIdx];
 twState=P.start.map(p=>p.slice());twMoves=0;twSel=-1;twFirstT=0;
 twOpt=twOptimal(P.start,P.target);
 twStartT=performance.now();
 twRender();
}
function twRender(){
 const target=TW_PUZ[twIdx].target;
 let pegs='';
 for(let i=0;i<3;i++){
  const discs=twState[i].map(d=>`<div style="width:${28+d*26}px;height:22px;background:${twSel===i?'#93c5fd':'#1e3a8a'};border-radius:6px;margin:3px auto"></div>`).join('');
  const tdiscs=target[i].map(d=>`<div style="width:${28+d*26}px;height:9px;background:#cbd5e1;border-radius:4px;margin:1px auto"></div>`).join('');
  pegs+=`<div style="flex:1;text-align:center"><div style="min-height:100px;display:flex;flex-direction:column-reverse;justify-content:flex-start;border-bottom:3px solid #334155;padding-bottom:4px">${discs||'<div style="height:25px"></div>'}</div><button onclick="twTap(${i})" style="margin-top:8px">Peg ${i+1}</button><div class="small" style="margin-top:6px">target</div><div style="display:flex;flex-direction:column-reverse;min-height:34px;justify-content:flex-start">${tdiscs||'<div style="height:9px"></div>'}</div></div>`;
 }
 app.innerHTML=`<h2>Tower</h2><p class="small">Puzzle ${twIdx+1}/${TW_PUZ.length} · Moves: <b>${twMoves}</b> · Fewest possible: <b>${twOpt}</b></p><div style="display:flex;gap:8px">${pegs}</div>`;
}
function twTap(i){
 if(!twFirstT)twFirstT=(performance.now()-twStartT)/1000;
 if(twSel===-1){if(twState[i].length){twSel=i;twRender()}return}
 if(i===twSel){twSel=-1;twRender();return}
 const from=twState[twSel],to=twState[i],d=from[from.length-1];
 if(!to.length||to[to.length-1]>d){from.pop();to.push(d);twMoves++}
 twSel=-1;
 if(twKey(twState)===twKey(TW_PUZ[twIdx].target)){
  twRes.push({moves:twMoves,optimal:twOpt,firstMoveS:+twFirstT.toFixed(1)});
  app.innerHTML=`<h2>Tower</h2><p>Solved in <b>${twMoves}</b> moves (fewest: ${twOpt}). First move after ${twFirstT.toFixed(1)}s.</p><button class="primary" onclick="twIdx++;twPuzzle()">Next</button>`;
 } else twRender();
}

/* ============ Game 3 — Money Exchange 1 (trust + fairness) ============ */
let m1Sent=0,m1Back=0;
function money1Intro(){
 setProgress(19);
 app.innerHTML=`<h2>Game 3 — Money Exchange</h2><p class="measure">Traits: <b>Generosity, Fairness</b> — ${CATS.generosity.work}; ${CATS.fairness.work}.</p>
 <p>You have <b>$10</b>, your partner has <b>$0</b>. Send any amount — it <b>triples</b> on the way. They send some back. Afterwards you will rate the fairness.</p>
 <button class="primary" onclick="m1Ask()">Begin</button>`;
}
function m1Ask(){
 app.innerHTML=`<h2>Money Exchange</h2><p>You have $10. How much do you send? (0–10)</p><input id="m1" type="number" inputmode="numeric" min="0" max="10"><button class="primary" onclick="m1Send()">Send</button>`;
 document.getElementById('m1').focus();
}
function m1Send(){
 m1Sent=Math.max(0,Math.min(10,+document.getElementById('m1').value||0));
 const tripled=m1Sent*3;m1Back=tripled*(0.3+Math.random()*0.35);
 app.innerHTML=`<h2>Money Exchange</h2><p>You sent <b>$${m1Sent}</b> → became <b>$${tripled.toFixed(2)}</b> → your partner returned <b>$${m1Back.toFixed(2)}</b>.</p>
 <p>How fair was this exchange?</p><p class="small">1 = very unfair · 10 = very fair</p>
 <input id="m1f" type="range" min="1" max="10" value="5" oninput="document.getElementById('m1fv').textContent=this.value"> <b id="m1fv">5</b>/10<br><br>
 <button class="primary" onclick="T.money1={sent:m1Sent,fair:+document.getElementById('m1f').value};next()">Continue</button>
 <p class="small">Tip from candidates: make the rating match what actually happened.</p>`;
}

/* ============ Game 4 — Money Exchange 2 (altruism) ============ */
function money2Intro(){
 setProgress(27);
 app.innerHTML=`<h2>Game 4 — Sharing</h2><p class="measure">Traits: <b>Generosity, Fairness</b>.</p>
 <p>You receive an extra <b>$5</b>. Split it with your partner however you like — keep any portion. Then rate the fairness.</p>
 <button class="primary" onclick="m2Ask()">Begin</button>`;
}
function m2Ask(){
 app.innerHTML=`<h2>Sharing</h2><p>You have $5. How much do you <b>give</b> to your partner? (0–5)</p><input id="m2" type="number" inputmode="numeric" min="0" max="5"><button class="primary" onclick="m2Send()">Split</button>`;
 document.getElementById('m2').focus();
}
function m2Send(){
 const give=Math.max(0,Math.min(5,+document.getElementById('m2').value||0));
 app.innerHTML=`<h2>Sharing</h2><p>You kept <b>$${(5-give).toFixed(0)}</b> and gave <b>$${give.toFixed(0)}</b>.</p>
 <p>How fair was this split?</p><p class="small">1 = very unfair · 10 = very fair</p>
 <input id="m2f" type="range" min="1" max="10" value="5" oninput="document.getElementById('m2fv').textContent=this.value"> <b id="m2fv">5</b>/10<br><br>
 <button class="primary" onclick="T.money2={gave:${give},fair:+document.getElementById('m2f').value};next()">Continue</button>`;
}

/* ============ Game 5 — Keypress (START/STOP) ============ */
let kpTrials=[],kpIdx=0,kpStart=0,kpActive=false,kpHits=0,kpFalse=0,kpMiss=0,kpRT=[];
function keypressIntro(){
 setProgress(35);
 app.innerHTML=`<h2>Game 5 — Keypress</h2><p class="measure">Traits: <b>Attention, Effort</b> — reacting fast without jumping the gun.</p>
 <p>Press the <b>space bar</b> (or tap the screen) as fast as you can when you see <b>START</b>. Do nothing on <b>STOP</b>.</p>
 <p class="small">Never press before the word appears.</p>
 <p>About 20 trials.</p><button class="primary" onclick="kpStart_()">Begin</button>`;
}
function kpStart_(){
 kpTrials=Array.from({length:20},(_,i)=>i<14?'START':'STOP').sort(()=>Math.random()-.5);
 kpIdx=0;document.addEventListener('keydown',kpKey);kpTrial();
}
function kpTrial(){
 if(kpIdx>=kpTrials.length){document.removeEventListener('keydown',kpKey);T.keypress={hits:kpHits,falseStarts:kpFalse,misses:kpMiss,rt:kpRT};next();return}
 kpActive=false;
 app.innerHTML=`<h2>Keypress</h2><p class="small">Trial ${kpIdx+1}/20</p><div class="tapzone"><div class="big">…</div></div>`;
 setTimeout(()=>{
  const w=kpTrials[kpIdx];
  app.innerHTML=`<h2>Keypress</h2><p class="small">Trial ${kpIdx+1}/20</p><div id="kpz" class="tapzone"><div class="big" style="font-size:40px;color:${w==='START'?'#16a34a':'#dc2626'}">${w}</div></div>`;
  kpStart=performance.now();kpActive=true;
  document.getElementById('kpz').addEventListener('pointerdown',kpTap,{once:true});
  setTimeout(()=>kpEnd(false),1100);
 },500+Math.random()*700);
}
function kpTap(){if(kpActive)kpEnd(true)}
function kpKey(e){if(e.code==='Space'){e.preventDefault();kpTap()}}
function kpEnd(pressed){
 if(!kpActive)return;kpActive=false;
 const w=kpTrials[kpIdx],rt=performance.now()-kpStart;
 if(w==='START'&&pressed){kpHits++;kpRT.push(rt)}
 else if(w==='START'&&!pressed)kpMiss++;
 else if(w==='STOP'&&pressed)kpFalse++;
 kpIdx++;setTimeout(kpTrial,250);
}

/* ============ Game 6 — Easy or Hard ============
   The CHOICE ITSELF is the data point. */
const EH=[
 {e:1,h:4,q:'14 + 27 = ?',a:'41'},
 {e:1,h:5,q:'9 × 7 = ?',a:'63'},
 {e:2,h:6,q:'125 − 68 = ?',a:'57'},
 {e:2,h:8,q:'15 × 12 = ?',a:'180'},
 {e:3,h:9,q:'7³ = ?',a:'343'},
 {e:3,h:12,q:'144 ÷ 12 + 25 = ?',a:'37'}
];
let ehIdx=0,ehHard=0,ehHardOk=0,ehEarn=0;
function easyHardIntro(){
 setProgress(43);
 app.innerHTML=`<h2>Game 6 — Easy or Hard</h2><p class="measure">Traits: <b>Effort, Decision Making</b> — choosing challenge vs. safety.</p>
 <p>Each round: take the <b>easy</b> option for a small guaranteed amount, or the <b>hard</b> option for more — but you must solve a quick problem to earn it. A wrong answer earns $0.</p>
 <p>6 rounds.</p><button class="primary" onclick="ehRound()">Begin</button>`;
}
function ehRound(){
 if(ehIdx>=EH.length){T.easyhard={hardChosen:ehHard,hardSolved:ehHardOk,earned:ehEarn};next();return}
 const c=EH[ehIdx];
 app.innerHTML=`<h2>Easy or Hard</h2><p class="small">Round ${ehIdx+1}/6 · Earned: $${ehEarn}</p>
 <button onclick="ehPick('e')">EASY — $${c.e} guaranteed</button>
 <button class="primary" onclick="ehPick('h')">HARD — $${c.h} if you solve it</button>`;
}
function ehPick(which){
 const c=EH[ehIdx];
 if(which==='e'){ehEarn+=c.e;ehIdx++;ehRound();return}
 ehHard++;
 app.innerHTML=`<h2>Easy or Hard</h2><p>Solve for $${c.h}:</p><p class="big" style="font-size:36px">${c.q}</p><input id="eha" inputmode="numeric" autocomplete="off"><button class="primary" onclick="ehAns()">Submit</button>`;
 document.getElementById('eha').focus();
}
function ehAns(){
 const c=EH[ehIdx],ok=document.getElementById('eha').value.trim()===c.a;
 if(ok){ehHardOk++;ehEarn+=c.h}
 ehIdx++;
 app.innerHTML=`<h2>Easy or Hard</h2><div class="big">${ok?'✓':'×'}</div><p>${ok?`Correct — $${c.h} earned.`:'Wrong — $0.'}</p><button class="primary" onclick="ehRound()">Next</button>`;
}

/* ============ start ============ */
/* ============ Game 7 — Digits (flashing digit span) ============ */
let dgLen=3,dgRound=0,dgSeq=[],dgBest=0;
function digitsIntro(){
 setProgress(51);
 app.innerHTML=`<h2>Game 7 — Digits</h2><p class="measure">Traits: <b>Attention, Focus</b> — holding information in mind.</p>
 <p>Digits will <b>flash one at a time</b>. Then type them back <b>in order</b>. The sequence grows by one each round you get right.</p>
 <button class="primary" onclick="dgRoundFn()">Begin</button>`;
}
function dgRoundFn(){
 dgRound++;dgSeq=Array.from({length:dgLen},()=>Math.floor(Math.random()*10));
 let i=0;
 app.innerHTML=`<h2>Digits</h2><p class="small">Round ${dgRound} · ${dgLen} digits — watch…</p><div class="big" id="dgd">·</div>`;
 const iv=setInterval(()=>{
  if(i>=dgSeq.length){clearInterval(iv);
   app.innerHTML=`<h2>Digits</h2><p>Type the digits in order:</p><input id="dg" inputmode="numeric" autocomplete="off"><button class="primary" onclick="dgAns()">Submit</button>`;
   document.getElementById('dg').focus();return}

 <h3>Before the real assessment</h3>
 <div class="resultbox"><b>What the science actually says</b><br><span class="small">
 • These game types come from decades of published lab research: Balloons = Balloon Analogue Risk Task (Lejuez et al., 2002) · Tower = Tower of London (Shallice, 1982) · Arrows = flanker task (Eriksen &amp; Eriksen, 1974) · Cards = Iowa Gambling Task (Bechara et al., 1994) · Digits = digit span · Money games = trust/dictator games (Berg, Dickhaut &amp; McCabe, 1995) · Faces = emotion recognition (Baron-Cohen et al., 2001).<br>
 • Games correlate moderately with conventional cognitive tests (meta-analysis, Bipp et al., 2024: corrected r≈.45) — but peer-reviewed evidence that they predict job performance is thin, and none covers tenure.<br>
 • Vendor debiasing audits check statistical parity, not whether the games measure real ability; independent deployment research (Stanford HAI, 2026) found bias reappearing at the individual-job level.<br>
 • Single rounds of trust/generosity games are noisy in the literature — treat those scores as rough.<br>
 • Practice mainly removes the surprise penalty (Leutner et al., 2023: test–retest ≈.68). There is no personality to fake; consistency beats strategy.</span></div>
 <div class="warnbox"><b>One shot matters:</b> candidates report a single playthrough is reused across <b>all</b> employers you apply to, with a long wait before any retake. Do it once, rested, undistracted, full-screen.</div>
 <div class="tipbox">Never press before the signal appears (START, red circle). False starts are measured.</div>
 <div class="tipbox">On the Tower: don't touch anything at first. Study the puzzle and plan your moves, then start. The test measures how long you think before your first move — planning first reads as careful, moving instantly reads as impulsive.</div>
 <div class="tipbox">On fairness ratings: make the number match what actually happened in the exchange.</div>
 <div class="tipbox">You will see <b>no score</b> when you finish the real thing — just a completion message. The trait report goes to the employer. Silence is normal.</div>
 <div class="tipbox">There is no “ideal personality” to imitate. Play naturally and stay consistent across games.</div>

 <p class="small"><b>Important:</b> independent practice simulation. Not Harver/Pymetrics; not their scoring, traits, or hiring predictions. Industry profiles are theoretical models built for practice.</p>
 <div style="text-align:center"><button class="primary" onclick="location.reload()">Run again</button></div>`;
}
const DRILLS={
 attention:'Do Keypress and Stop again tomorrow, rested — steady reactions beat raw speed.',
 decision:'Replay Tower and Cards; say your plan out loud before each move.',
 effort:'On Easy-or-Hard, pick HARD whenever you can actually solve it — follow-through is scored.',
 emotion:'Spend 5 minutes labeling emotions in photos; go with your first read.',
 fairness:'Re-run the money games and check each rating honestly matches what happened.',
 focus:'Replay Arrows; pause and breathe for two seconds between trials.',
 generosity:'Notice your first split impulse — natural generosity reads better than strategy.',
 learning:'Replay Cards; every 10 cards, write down which decks feel good and why.',
 risk:'Replay Balloons and bank at roughly two-thirds of where balloons usually pop.'
};
function copySummary(){
 const s=window._sum;if(!s)return;
 const lines=[`Behavioral Games Practice — ${new Date().toISOString().slice(0,10)} (${INDUSTRIES[s.ind].name})`,
 `Fit: ${s.fitLabel}`,
 `Top 3 distinctive: ${s.top3.map(k=>CATS[k].name+' ('+band(s.S[k])+')').join(', ')}`,
 `All categories: ${s.ranked.map(k=>CATS[k].name+' '+s.S[k]).join(' · ')}`];
 lines.push(s.flags.length?('Consistency flags: '+s.flags.join(' | ')):'Consistency: all consistent');
 const txt=lines.join('\n');
 const done=()=>{document.getElementById('copied').textContent='✓ Copied — paste it anywhere.'};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>{prompt('Copy your summary:',txt)})}
 else prompt('Copy your summary:',txt);
}
function workLine(k){
 return {attention:'You are likely to catch details others miss and stay on task.',
 decision:'You are likely to make steady calls even when information is incomplete.',
 effort:'You are likely to take on hard problems and persist until they are solved.',
 emotion:'You are likely to read people well and stay composed.',
 fairness:'You are likely to notice inequity and prefer balanced outcomes.',
 focus:'You are likely to concentrate through noise and competing demands.',
 generosity:'You are likely to share resources and credit with others.',
 learning:'You are likely to adapt fast when the rules change.',
 risk:'You are likely to size up uncertain bets calmly.'}[k];
}

start();
