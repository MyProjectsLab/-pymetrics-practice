<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Behavioral Games Practice — Familiarization Simulator</title>
<style>
:root{--ink:#1f2937;--mut:#6b7280;--blue:#2563eb;--blue-d:#1d4ed8;--green:#16a34a;--red:#dc2626;--amber:#b45309;--card:#ffffff;--line:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
background:linear-gradient(135deg,#4c63d2 0%,#7c5cbf 50%,#9a6bc4 100%);min-height:100vh;font-size:17px;line-height:1.55;touch-action:manipulation}
#topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:10px 16px}
#gamelabel{font-weight:700;font-size:15px;color:var(--ink)}
#barwrap{height:8px;background:#e5e7eb;border-radius:99px;margin-top:6px;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#7c3aed);border-radius:99px;transition:width .4s}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border-radius:18px;padding:26px 22px;margin:0 0 18px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
h1{font-size:30px;margin:.2em 0}
h2{font-size:24px;margin:.2em 0 .6em}
h3{font-size:20px;margin:1.2em 0 .5em}
p{margin:.7em 0}
.small{font-size:14px;color:var(--mut)}
button{font-family:inherit;font-size:18px;padding:14px 22px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:56px;margin:6px 6px 6px 0;font-weight:600}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:active{background:var(--blue-d)}
button.big{font-size:21px;padding:18px 26px;min-height:72px;min-width:200px}
button:active{transform:scale(.98)}
button:disabled{opacity:.5;cursor:default}
.readbox{background:#fef2f2;border-left:7px solid var(--red);border-radius:12px;padding:18px;margin:18px 0}
.readbox .rh{font-size:26px;font-weight:800;letter-spacing:.5px;margin:0 0 8px}
.readbox p{margin:.5em 0}
.kw{display:inline-block;border:2px solid var(--ink);border-radius:8px;padding:2px 10px;margin:3px;font-weight:800;font-size:15px;background:#fff}
.warnbox{background:#fffbeb;border:2px solid #f59e0b;border-radius:12px;padding:14px 16px;margin:14px 0}
.tipbox{background:#eff6ff;border:2px solid #93c5fd;border-radius:12px;padding:14px 16px;margin:14px 0}
.resultbox{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.exbox{background:#f0fdf4;border:2px dashed var(--green);border-radius:12px;padding:16px;margin:14px 0}
.exred{font-size:34px;font-weight:800;letter-spacing:2px}
.exsmall{font-size:15px}
input[type=number],input[type=text]{font-size:20px;padding:12px;border-radius:12px;border:2px solid var(--line);width:140px;text-align:center;margin:6px}
input[type=range]{width:100%;margin:10px 0}
.nosel{user-select:none;-webkit-user-select:none}
.stim{min-height:220px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:800}
.count{font-size:96px;font-weight:800;text-align:center;padding:40px 0}
.tapbtn{font-size:26px;font-weight:800;min-height:110px;min-width:230px;border-radius:20px}
.arrowbtn{font-size:56px;min-width:120px;min-height:110px}
.pegrow{display:flex;justify-content:space-around;align-items:flex-end;min-height:230px;margin:10px 0}
.peg{width:30%;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border-bottom:8px solid #9ca3af;cursor:pointer;padding-bottom:4px}
.peg.sel{outline:4px solid var(--blue);border-radius:12px}
.disk{height:34px;border-radius:8px;margin:2px 0;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.deckbtn{min-width:130px;min-height:96px;font-size:20px}
.facebtn{font-size:17px;min-height:60px;min-width:44%}
.padbtn{font-size:24px;min-width:76px;min-height:64px}
.checklist{list-style:none;padding:0}
.checklist li{padding:8px 0 8px 34px;position:relative;font-size:17px}
.checklist li:before{content:"☐";position:absolute;left:0;font-size:20px}
details{margin:14px 0}
summary{font-weight:700;cursor:pointer;font-size:18px;padding:8px 0}
table.metrics{width:100%;border-collapse:collapse;font-size:16px}
table.metrics td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.metrics td:last-child{text-align:right;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay .card{max-width:480px;margin:0}
textarea.copyarea{width:100%;min-height:220px;font-size:14px;border-radius:12px;border:2px solid var(--line);padding:10px}
@media (max-width:480px){.card{padding:20px 16px}h1{font-size:26px}.readbox .rh{font-size:24px}}
</style>
</head>
<body>
<div id="topbar"><div id="gamelabel">Behavioral Games Practice</div><div id="barwrap"><div id="bar"></div></div></div>
<main id="app"></main>
<script>
"use strict";
/* ================= utilities ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ri(rng,lo,hi){return lo+Math.floor(rng()*(hi-lo+1));}
function pickR(rng,arr){return arr[Math.floor(rng()*arr.length)];}
function shuffleR(rng,arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function median(arr){if(!arr.length)return 0;var a=arr.slice().sort(function(x,y){return x-y;});var m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2;}
function mean(arr){if(!arr.length)return 0;return arr.reduce(function(a,b){return a+b;},0)/arr.length;}
function fmtT(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
var app=document.getElementById("app"),barEl=document.getElementById("bar"),labelEl=document.getElementById("gamelabel");
function setApp(html){app.innerHTML=html;window.scrollTo(0,0);}
function setHeader(txt,pct){labelEl.textContent=txt;barEl.style.width=pct+"%";}
function on(id,ev,fn){var el=document.getElementById(id);if(el)el.addEventListener(ev,fn);return el;}
/* ================= game metadata (no trait language) ================= */
var GKEYS=["balloons","tower","money","sharing","keypress","easyhard","digits","stop","arrows","lengths","cards","faces"];
var GTITLES={balloons:"Balloons",tower:"Planning",money:"Money Exchange",sharing:"Sharing",keypress:"Keypress",easyhard:"Easy or Hard",digits:"Digit Memory",stop:"Stop Signal",arrows:"Arrows",lengths:"Visual Comparison",cards:"Card Decks",faces:"Faces"};
var INVOLVED={
balloons:"This task involved repeated choices under uncertainty where potential reward increased alongside potential loss.",
tower:"This task involved planning several moves ahead while respecting constraints.",
money:"This task involved deciding how much to entrust to another participant, with the amount multiplied and part of it returned.",
sharing:"This task involved deciding how to split an amount with another participant.",
keypress:"This task involved rapid responding while inhibiting responses to non-targets.",
easyhard:"This task involved choosing between easier and harder tasks for different rewards, then completing the chosen task.",
digits:"This task involved holding and manipulating a sequence of digits over a short period.",
stop:"This task involved responding quickly while withholding the response for one specific signal.",
arrows:"This task involved responding to a target while ignoring conflicting surrounding information.",
lengths:"This task involved making quick visual comparisons.",
cards:"This exercise required learning from repeated, somewhat noisy feedback.",
faces:"This task involved identifying expressions from faces."};
/* balanced order templates: reaction games (keypress/stop/arrows) never back-to-back;
   demanding games distributed across the session; ~same total difficulty/duration */
var ORDER_TEMPLATES=[
["balloons","tower","money","sharing","keypress","easyhard","digits","stop","lengths","arrows","cards","faces"],
["tower","balloons","sharing","money","arrows","digits","easyhard","stop","cards","keypress","lengths","faces"],
["money","cards","balloons","tower","stop","easyhard","sharing","digits","keypress","lengths","arrows","faces"],
["sharing","money","tower","balloons","keypress","cards","digits","arrows","easyhard","stop","lengths","faces"],
["easyhard","digits","balloons","money","stop","tower","sharing","arrows","cards","keypress","faces","lengths"],
["digits","easyhard","sharing","balloons","arrows","money","tower","keypress","cards","stop","faces","lengths"],
["cards","money","digits","sharing","stop","balloons","easyhard","arrows","tower","keypress","lengths","faces"],
["balloons","sharing","easyhard","cards","keypress","money","digits","stop","tower","arrows","faces","lengths"],
["tower","digits","money","easyhard","arrows","sharing","balloons","stop","cards","keypress","faces","lengths"],
["faces","lengths","keypress","cards","money","stop","digits","sharing","tower","arrows","balloons","easyhard"]];
/* pick a template no-reuse-until-all-used; cycle resets (reshuffled) after all 10 presented */
function pickTemplate(){
 var KEY="bgp_templates_used",used=[];
 try{used=JSON.parse(localStorage.getItem(KEY)||"[]");}catch(e){used=[];}
 used=used.filter(function(i){return i>=0&&i<ORDER_TEMPLATES.length;});
 if(used.length>=ORDER_TEMPLATES.length){used=[];mathUsedClear();} /* full cycle done -> reset, new random order, fresh question history */
 var avail=[];
 for(var i=0;i<ORDER_TEMPLATES.length;i++)if(used.indexOf(i)<0)avail.push(i);
 var ti=avail[Math.floor(Math.random()*avail.length)];
 used.push(ti);
 try{localStorage.setItem(KEY,JSON.stringify(used));}catch(e){}
 return ti;
}

/* ================= reading reminder ================= */
function readReminder(full){
 var kw=["ONLY","EXCEPT","NOT","BEFORE","AFTER","FIRST","LAST","SAME","DIFFERENT"].map(function(k){return '<span class="kw">'+k+'</span>';}).join("");
 var h='<div class="readbox"><p class="rh">READ EVERY SINGLE WORD<br>BEFORE YOU ACT</p>';
 if(full){
  h+='<p>Small details and qualifiers can <b>completely change the rule</b>. Do not react only to the first familiar word, color or shape you notice.</p>';
  h+='<div class="exbox"><p style="margin:0 0 6px"><b>Example:</b> Respond <b>ONLY</b> to a <span class="exred">RED</span> <span class="exsmall">circle</span>.</p>';
  h+='<p style="margin:0"><b>RED</b> is part of the instruction. A circle by itself is <b>not</b> enough.</p></div>';
  h+='<p>Pay special attention to words such as:</p><p>'+kw+'</p>';
  h+='<p>And to: <b>colors, shapes, capitalization, whether a rule changed, timing requirements, small qualifiers</b>.</p>';
  h+='<p><b>Treat every new game as a completely new set of instructions.</b> Never assume the rule is the same as the previous game.</p>';
 }else{
  h+='<p style="margin:0">Small details can completely change the rule. '+kw+'</p>';
 }
 return h+'</div>';
}

/* ================= run state ================= */
var S=null; /* run state */
function getRuns(){var r=[];try{r=JSON.parse(localStorage.getItem("bgp_runs2")||"[]");}catch(e){}return r;}
function gameRng(key){var n=(S.restarts&&S.restarts[key])||0;return mulberry32(hashStr(S.seed+":"+key+":"+n));}

/* ================= start + pretest screens ================= */
function startScreen(){
 setHeader("Behavioral Games Practice",0);
 var runs=getRuns();
 var repeat=runs.length?'<div class="readbox"><p class="rh" style="font-size:24px">YOU MAY RECOGNIZE THE GAME.<br>DO NOT ASSUME YOU REMEMBER THE RULE.<br>READ THE NEW INSTRUCTIONS COMPLETELY.</p></div>':"";
 setApp('<div class="card"><h1>Behavioral Games Practice</h1>'
 +'<div class="warnbox"><b>This simulator is for familiarization only. It is not Harver/Pymetrics.</b> The real assessment may use different games, instructions, timing and scoring.</div>'
 +'<div class="resultbox" style="text-align:center;font-size:20px"><b>About 25 minutes &middot; 12 games &middot; one sitting</b></div>'
 +readReminder(true)
 +'<h3>Before you start — checklist</h3><ul class="checklist">'
 +'<li>quiet room</li><li>rested</li><li>not hungry</li><li>stable internet</li>'
 +'<li>notifications off, phone on Do Not Disturb</li><li>no other browser tabs needed</li>'
 +'<li>ideally laptop/desktop (mobile works too)</li>'
 +'<li>no notes or calculator unless the instructions explicitly allow them</li>'
 +'<li>complete it without interruption</li></ul>'
 +'<div class="tipbox"><b>Do not try to guess what Blackstone wants. Play naturally and consistently.</b></div>'
 +'<p>The point of this practice is to <b>remove the surprise factor</b>, not to train a personality.</p>'
 +'<div class="resultbox"><b>How many runs?</b><br><span class="small">We recommend <b>one</b> serious complete run. A second run is acceptable only if the first was mainly spent learning the interface or was interrupted. Do not repeat runs to move metrics or change behavior.</span></div>'
 +'<p class="small">🔒 Your practice results remain on <b>this device only</b>. They are not sent to Blackstone, Harver/Pymetrics, ChatGPT or any employer. No account needed; nothing is uploaded.</p>'
 +repeat
 +'<button class="primary big" id="b-go">Continue</button> '
 +(runs.length?'<button id="b-hist">Past runs ('+runs.length+')</button>':"")
 +'</div>');
 on("b-go","click",newRun);
 if(runs.length)on("b-hist","click",historyScreen);
}

/* ================= engine ================= */
function curKey(){return S.order[S.idx];}
function showIntro(){
 var k=curKey();
 setHeader("Game "+(S.idx+1)+" of 12 — "+GTITLES[k],Math.round(S.idx/12*100));
 INTRO[k]();
}
function showTutorial(){
 var k=curKey();
 setHeader("Game "+(S.idx+1)+" of 12 — "+GTITLES[k]+" (practice example)",Math.round(S.idx/12*100));
 TUT[k](showReady);
}
function showReady(){
 var k=curKey();
 setApp('<div class="card"><h2>'+GTITLES[k]+'</h2><div class="tipbox" style="font-size:20px"><b>Ready for the actual practice?</b><br><span class="small">The example is over. What comes next counts for this practice run.</span></div>'
 +'<button class="primary big" id="b-start">Start</button></div>');
 on("b-start","click",beginPlay);
}
var timedCtx=null; /* {key} while a timed game is playing */
function beginPlay(){
 var k=curKey();
 S.runId=(S.runId||0)+1;
 S.times[k]={start:Date.now()};
 if(TIMED[k])timedCtx={key:k,pending:false};
 setHeader("Game "+(S.idx+1)+" of 12 — "+GTITLES[k],Math.round(S.idx/12*100));
 PLAY[k]();
}
function finishGame(k,metrics){
 S.times[k].end=Date.now();
 S.metrics[k]=metrics;
 timedCtx=null;
 S.idx++;
 if(S.idx<12)showIntro();else showResults();
}
function tutRetry(k){
 S.tutRetries[k]=(S.tutRetries[k]||0)+1;
}
function countdownThen(fn){
 var steps=["3","2","1","GO"];
 var i=0;
 setApp('<div class="card nosel"><div class="count" id="cd">3</div><p class="small" style="text-align:center">Taps during the countdown do not count.</p></div>');
 var el=document.getElementById("cd");
 var iv=setInterval(function(){i++;if(i<steps.length){el.textContent=steps[i];}else{clearInterval(iv);fn();}},650);
}
/* interruption handling */
document.addEventListener("visibilitychange",function(){
 if(document.hidden&&timedCtx&&!timedCtx.pending){
  timedCtx.pending=true;
  S.interruptions=(S.interruptions||0)+1;
  if(S.interruptedKeys.indexOf(timedCtx.key)<0)S.interruptedKeys.push(timedCtx.key);
 }
});
function checkInterruptResume(){
 /* call at safe points (between trials): if interrupted while hidden, offer restart */
 if(timedCtx&&timedCtx.pending){
  timedCtx.pending=false;
  var k=timedCtx.key;timedCtx=null;
  setApp('<div class="overlay"><div class="card"><h2>Game interrupted</h2>'
  +'<p>This game was <b>INTERRUPTED</b> (the page was hidden — tab switch, call, lock screen). Reaction times from an interrupted game would be distorted, so they are discarded.</p>'
  +'<button class="primary big" id="b-restart">Restart this game</button></div></div>');
  on("b-restart","click",function(){
   S.restarts=S.restarts||{};S.restarts[k]=(S.restarts[k]||0)+1;
   delete S.metrics[k];delete S.times[k];
   beginPlay();
  });
  return true;
 }
 return false;
}
var INTRO={},TUT={},PLAY={},TIMED={};
function newRun(){
 var seed=(Date.now()^Math.floor(Math.random()*4294967296))>>>0;
 var tpl=pickTemplate();
 var order=ORDER_TEMPLATES[tpl].slice();
 S={seed:seed,tpl:tpl,order:order,idx:0,metrics:{},times:{},tutRetries:{},restarts:{},interruptions:0,interruptedKeys:[],t0:Date.now()};
 showIntro();
}
/* ================= Game 1 — Balloons ================= */
INTRO.balloons=function(){
 var ph=pickR(gameRng("balloons"),PHR.balloons);
 setApp('<div class="card"><h2>Balloons</h2>'+readReminder(false)
 +ph
 +'<button class="primary big" id="b-tut">Begin practice example</button></div>');
 on("b-tut","click",showTutorial);
};
TUT.balloons=function(done){
 var pumped=false;
 setApp('<div class="card"><h2>Practice example — this does not count</h2>'
 +'<p>Pump the balloon <b>at least once</b>, then press <b>BANK</b>.</p>'
 +'<div class="stim"><div id="bl" style="width:90px;height:110px;border-radius:50%;background:#e05252;transition:all .2s"></div></div>'
 +'<p style="text-align:center;font-size:22px">Balloon value: $<span id="bv">0.00</span></p>'
 +'<div style="text-align:center"><button class="big" id="b-pump">PUMP</button> <button class="big" id="b-bank">BANK</button></div>'
 +'<p class="small" id="tmsg"></p></div>');
 var v=0,sz=90;
 on("b-pump","click",function(){v+=0.05;sz+=9;var b=document.getElementById("bl");b.style.width=sz+"px";b.style.height=(sz+20)+"px";document.getElementById("bv").textContent=v.toFixed(2);pumped=true;});
 on("b-bank","click",function(){
  if(!pumped){document.getElementById("tmsg").textContent="Pump at least once first, so you see how pumping works.";return;}
  done();
 });
};
PLAY.balloons=function(){
 var rng=gameRng("balloons");
 var colors=["#e05252","#4a7de0","#3fae6a"];
 var cnames=["red","blue","green"];
 var order=[];for(var i=0;i<39;i++)order.push(i%3);
 order=shuffleR(rng,order);
 var classes=shuffleR(rng,[{lo:12,hi:20},{lo:8,hi:14},{lo:4,hi:9}]);
 var rounds=order.map(function(ci){var cl=classes[ci];return{ci:ci,pop:ri(rng,cl.lo,cl.hi)};});
 var r=0,pumps=0,banked=0,pops=0,val=0;
 var perColor=[{pumps:0,pops:0,banked:0},{pumps:0,pops:0,banked:0},{pumps:0,pops:0,banked:0}];
 var allPumps=[];
 function render(){
  var rd=rounds[r];
  setApp('<div class="card nosel"><h2>Balloon '+(r+1)+' / 39</h2>'
  +'<div class="stim"><div id="bl" style="width:'+(90+pumps*9)+'px;height:'+(110+pumps*9)+'px;border-radius:50%;background:'+colors[rd.ci]+';transition:all .2s"></div></div>'
  +'<p style="text-align:center;font-size:22px">Balloon value: $<span id="bv">'+val.toFixed(2)+'</span> &nbsp;·&nbsp; Total banked: $<span id="bt">'+banked.toFixed(2)+'</span></p>'
  +'<div style="text-align:center"><button class="big" id="b-pump">PUMP</button> <button class="big" id="b-bank">BANK</button></div></div>');
  on("b-pump","click",doPump);on("b-bank","click",doBank);
 }
 function doPump(){
  if(checkInterruptResume())return;
  pumps++;val+=0.05;perColor[rounds[r].ci].pumps++;
  if(pumps>=rounds[r].pop){
   pops++;perColor[rounds[r].ci].pops++;allPumps.push(pumps);
   setApp('<div class="card"><h2>💥 It popped!</h2><p>The '+cnames[rounds[r].ci]+' balloon popped after '+pumps+' pumps. You lose this balloon\'s money.</p><button class="primary" id="b-nx">Next balloon</button></div>');
   on("b-nx","click",nextRound);return;
  }
  render();
 }
 function doBank(){
  if(checkInterruptResume())return;
  banked+=val;perColor[rounds[r].ci].banked+=val;allPumps.push(pumps);
  nextRound();
 }
 function nextRound(){
  r++;pumps=0;val=0;
  if(r>=39){finishGame("balloons",{rounds:39,totalPumps:allPumps.reduce(function(a,b){return a+b;},0),avgPumps:mean(allPumps),pops:pops,banked:Math.round(banked*100)/100,perColor:perColor.map(function(c,i){return{color:cnames[i],pumps:c.pumps,pops:c.pops,banked:Math.round(c.banked*100)/100};})});return;}
  render();
 }
 render();
};

/* ================= Game 2 — Tower ================= */
function towerBFS(start,target,n){
 var enc=function(s){return s.join("");};
 var seen={};seen[enc(start)]=0;
 var q=[start.slice()];
 while(q.length){
  var s=q.shift();var d=seen[enc(s)];
  if(enc(s)===enc(target))return d;
  for(var a=0;a<3;a++)for(var b=0;b<3;b++){
   if(a===b)continue;
   var topA=-1;for(var i=0;i<n;i++)if(s[i]===a&&(topA<0||i<topA))topA=i;
   if(topA<0)continue;
   var topB=-1;for(var j=0;j<n;j++)if(s[j]===b&&(topB<0||j<topB))topB=j;
   if(topB>=0&&topB<topA)continue;
   var ns=s.slice();ns[topA]=b;
   if(!(enc(ns)in seen)){seen[enc(ns)]=d+1;q.push(ns);}
  }
 }
 return -1;
}
function towerGenBank(rng){
 var bank=[];
 for(var p=0;p<12;p++){
  var n=p<6?3:4;
  var start=[],target=[];
  for(var d=0;d<n;d++){start.push(ri(rng,0,2));target.push(2);}
  var opt=towerBFS(start,target,n);
  var minOpt=n===3?5:8;
  var guard=0;
  while((opt<minOpt||enc2(start)===enc2(target))&&guard++<60){
   start=[];for(var d2=0;d2<n;d2++)start.push(ri(rng,0,2));
   opt=towerBFS(start,target,n);
  }
  bank.push({n:n,start:start,optimal:opt});
 }
 return bank;
 function enc2(s){return s.join("");}

function towerPlayUI(cfg,onSolved,opts){
 opts=opts||{};
 var n=cfg.n;
 var pegs=[[],[],[]];
 for(var d=n-1;d>=0;d--)pegs[cfg.start[d]].push(d+1); /* disk sizes 1..n, 1 smallest */
 var sel=-1,moves=0,t0=Date.now(),firstMoveS=null,msg="";
 function render(){
  var ph="";
  for(var p=0;p<3;p++){
   var disks=pegs[p].slice().reverse().map(function(sz){
    var w=60+sz*(130/n);
    return '<div class="disk" style="width:'+w+'px;background:'+["#8b5cf6","#6366f1","#3b82f6","#0ea5e9"][sz%4]+'">'+sz+'</div>';
   }).join("");
   ph+='<div class="peg'+(sel===p?" sel":"")+'" data-p="'+p+'">'+disks+'</div>';
  }
  var target="Target: all disks on the <b>right</b> peg, largest at the bottom.";
  setApp('<div class="card nosel"><h2>'+(opts.title||"Planning")+'</h2><p>'+target+'</p>'
  +'<div class="pegrow">'+ph+'</div>'
  +'<p>Moves: <b>'+moves+'</b>'+(opts.showOptimal?' · Fewest possible: <b>'+cfg.optimal+'</b>':"")+'</p>'
  +'<p class="small" id="tmsg">'+msg+'</p></div>');
  var els=app.querySelectorAll(".peg");
  for(var i=0;i<els.length;i++)els[i].addEventListener("click",pegClick);
 }
 function pegClick(e){
  var p=+e.currentTarget.getAttribute("data-p");msg="";
  if(sel<0){
   if(!pegs[p].length){msg="That peg is empty.";render();return;}
   sel=p;render();return;
  }
  if(p===sel){sel=-1;render();return;}
  var moving=pegs[sel][pegs[sel].length-1];
  var destTop=pegs[p][pegs[p].length-1];
  if(destTop!==undefined&&destTop<moving){msg="A larger disk can't go on top of a smaller one.";sel=-1;render();return;}
  pegs[sel].pop();pegs[p].push(moving);moves++;
  if(firstMoveS===null)firstMoveS=(Date.now()-t0)/1000;
  sel=-1;
  var won=pegs[0].length===0&&pegs[1].length===0&&pegs[2].length===n;
  if(won){onSolved({moves:moves,optimal:cfg.optimal,secs:(Date.now()-t0)/1000,firstMoveS:firstMoveS===null?0:Math.round(firstMoveS*10)/10});return;}
  render();
 }
 render();
}

function keypressTrials(seq,pair,opts,done){
 /* generic runner: seq of "go"/"nogo"; opts.tutorial bool */
 var i=0,hits=0,misses=0,falseAlarms=0,correctRej=0,premature=0,rts=[];
 var stimOn=false,responded=false,stimT0=0,cd=false;
 var rid=S.runId;
 function alive(){return rid===S.runId;}
 function renderFix(msg){
  setApp('<div class="card nosel"><p style="text-align:center" class="small">'+(opts.tutorial?"Practice example — this does not count":"Trial "+(i+1)+" of "+seq.length)+'</p>'
  +'<div class="stim" id="stim"><span style="font-size:56px;color:#9ca3af">+</span></div>'
  +'<p id="fb" style="text-align:center;min-height:28px;font-weight:700">'+(msg||"")+'</p>'
  +'<div style="text-align:center"><button class="tapbtn" id="b-tap">TAP</button></div>'
  +'<p class="small" style="text-align:center">Tap the button or press any key — but ONLY for '+pair.go+'.</p></div>');
  on("b-tap","click",respond);
 }
 function trial(){
  if(!alive())return;
  if(checkInterruptResume())return;
  if(i>=seq.length){cleanup();done({hits:hits,misses:misses,falseAlarms:falseAlarms,correctRej:correctRej,premature:premature,rts:rts,trials:seq.length});return;}
  responded=false;stimOn=false;
  renderFix("");
  var iti=900+Math.random()*1300;
  setTimeout(function(){
   if(!alive())return;
   if(checkInterruptResume())return;
   stimOn=true;stimT0=performance.now();
   var st=document.getElementById("stim");
   if(st)st.innerHTML='<span style="font-size:64px;color:'+(seq[i]==="go"?"#16a34a":"#dc2626")+'">'+(seq[i]==="go"?pair.go:pair.nogo)+'</span>';
   setTimeout(function(){
    if(!alive())return;
    if(stimOn&&!responded){
     stimOn=false;
     if(seq[i]==="go"){misses++;flash("Missed");}
     else{correctRej++;flash("Correct — withheld");}
    }
   },1500);
  },iti);
 }
 function flash(msg){var f=document.getElementById("fb");if(f){f.textContent=msg;}setTimeout(function(){if(alive()){i++;trial();}},450);}
 function respond(){
  if(!alive()||responded||cd)return;
  if(!stimOn){premature++;var f=document.getElementById("fb");if(f){f.textContent="Too early — wait for the word.";f.style.color="#dc2626";setTimeout(function(){if(f){f.textContent="";f.style.color="";}},700);}return;}
  responded=true;stimOn=false;
  var rt=performance.now()-stimT0;
  if(seq[i]==="go"){hits++;rts.push(rt);flash("Correct");}
  else{falseAlarms++;flash("Incorrect — that was "+pair.nogo);}
 }
 function keyH(e){respond();}
 document.addEventListener("keydown",keyH);
 function cleanup(){document.removeEventListener("keydown",keyH);}
 var origDone=done;
 done=function(res){cleanup();origDone(res);};
 trial();
}

var MATH_USED_KEY="bgp_math_used";
function mathUsedGet(){var o={};try{var a=JSON.parse(localStorage.getItem(MATH_USED_KEY)||"[]");for(var i=0;i<a.length;i++)o[a[i]]=1;}catch(e){}return o;}
function mathUsedAdd(sig){try{var a=JSON.parse(localStorage.getItem(MATH_USED_KEY)||"[]");if(a.indexOf(sig)<0){a.push(sig);localStorage.setItem(MATH_USED_KEY,JSON.stringify(a));}}catch(e){}}
function mathUsedClear(){try{localStorage.removeItem(MATH_USED_KEY);}catch(e){}}
/* mathBank rejects any question already shown in the current 10-run cycle */
function mathBank(rng){
 var easy=[],hard=[];
 var used=mathUsedGet();
 function bankAdd(arr,gen){
  for(var guard=0;guard<300;guard++){
   var qa=gen(),sig=qa.q+" = "+qa.a;
   if(!used[sig]){used[sig]=1;mathUsedAdd(sig);arr.push(qa);return;}
  }
  arr.push(gen()); /* practically unreachable: question space is far larger than a cycle */
 }
 var easyGens=[
  function(){var a=ri(rng,6,60),b=ri(rng,6,60);return{q:a+" + "+b+" = ?",a:a+b};},
  function(){var c=ri(rng,12,99),d=ri(rng,5,c-1);return{q:c+" − "+d+" = ?",a:c-d};},
  function(){var e=ri(rng,2,9),f=ri(rng,3,9);return{q:e+" × "+f+" = ?",a:e*f};},
  function(){var g=ri(rng,4,40)*2;return{q:"Half of "+g+" = ?",a:g/2};}
 ];
 var hardGens=[
  function(){var h=ri(rng,12,19),k=ri(rng,3,9);return{q:h+" × "+k+" = ?",a:h*k};},
  function(){var dv=pickR(rng,[3,4,6,8,12]),qq=ri(rng,4,14),cc=ri(rng,5,40);return{q:(dv*qq)+" ÷ "+dv+" + "+cc+" = ?",a:qq+cc};},
  function(){var p=pickR(rng,[10,15,20,25,50]),nn=pickR(rng,[2,4,5,8,10])*20;return{q:p+"% of "+nn+" = ?",a:Math.round(p/100*nn)};},
  function(){var s1=ri(rng,3,9),s2=ri(rng,3,9);return{q:s1+"² + "+s2+"² = ?",a:s1*s1+s2*s2};},
  function(){var fr=pickR(rng,[[1,2],[1,4],[3,4],[2,3]]),bb=pickR(rng,[2,3,4,5,6])*fr[1];return{q:fr[0]+"/"+fr[1]+" of "+bb+" = ?",a:Math.round(fr[0]/fr[1]*bb)};},
  function(){var m1=ri(rng,4,20),m2=ri(rng,2,9),m3=ri(rng,2,9);return{q:m1+" + "+m2+" × "+m3+" = ?",a:m1+m2*m3};}
 ];
 for(var i=0;i<6;i++)bankAdd(easy,easyGens[ri(rng,0,3)]);
 for(var j=0;j<6;j++)bankAdd(hard,hardGens[ri(rng,0,5)]);
 return{easy:shuffleR(rng,easy),hard:shuffleR(rng,hard)};
}

function digitSeq(rng,len){
 for(var t=0;t<80;t++){
  var s=[];for(var i=0;i<len;i++)s.push(ri(rng,0,9));
  var ok=true,counts={};
  for(var j=0;j<len;j++){
   counts[s[j]]=(counts[s[j]]||0)+1;
   if(counts[s[j]]>2)ok=false;
   if(j>0&&s[j]===s[j-1])ok=false;
  }
  /* reject runs of 4+ monotonic steps */
  var run=1,dir=0;
  for(var k=1;k<len;k++){
   var d=s[k]-s[k-1];
   if(Math.abs(d)===1&&d===dir){run++;}
   else if(Math.abs(d)===1){run=2;dir=d;}
   else{run=1;dir=0;}
   if(run>=4)ok=false;
  }
  if(ok)return s;
 }
 var s2=[];for(var m=0;m<len;m++)s2.push(ri(rng,0,9));return s2;
}

 var goodDecks=shuffleR(rng,[0,1,2,3]).slice(0,2);
 var seqs=[0,1,2,3].map(function(d){return goodDecks.indexOf(d)>=0?goodSeq.slice():badSeq.slice();});
 var ptr=[0,0,0,0],total=2000,n=0,picks=[];
 var names=["A","B","C","D"];
 function render(msg){
  setApp('<div class="card nosel"><h2>Card Decks</h2>'
  +'<p style="font-size:22px">Total: $<b>'+total+'</b> · Pick '+(n+1)+' of 40</p>'
  +'<p id="fb" style="min-height:30px;font-weight:700;font-size:20px">'+(msg||"")+'</p>'
  +'<div style="text-align:center">'+names.map(function(d,i){return '<button class="deckbtn" data-d="'+i+'">'+d+'</button>';}).join("")+'</div></div>');
  var btns=app.querySelectorAll(".deckbtn");
  for(var i=0;i<btns.length;i++)btns[i].addEventListener("click",function(e){
   var d=+e.currentTarget.getAttribute("data-d");
   var out=seqs[d][ptr[d]%10];ptr[d]++;
   total+=out;n++;picks.push({deck:d,good:goodDecks.indexOf(d)>=0,out:out});
   if(n>=40){
    var ppd=[0,0,0,0];picks.forEach(function(p){ppd[p.deck]++;});
    var last20=picks.slice(-20),first20=picks.slice(0,20);
    finishGame("cards",{picks:40,finalTotal:total,picksPerDeck:ppd,goodDecks:goodDecks.map(function(d){return names[d];}).join(", "),goodEarly:first20.filter(function(p){return p.good;}).length,goodLate:last20.filter(function(p){return p.good;}).length});
    return;
   }
   render((out>=0?"+$":"−$")+Math.abs(out));
  });
 }
 render("");
};

/* ================= Game 12 — Faces ================= */
var FEMOTIONS=["happy","sad","angry","surprised","fearful","neutral"];
INTRO.faces=function(){
 var ph=pickR(gameRng("faces"),PHR.faces);
 setApp('<div class="card"><h2>Faces</h2>'+readReminder(false)
 +ph
 +'<button class="primary big" id="b-tut">Begin practice example</button></div>');
 on("b-tut","click",showTutorial);
};
function drawFace(cv,frng,emotion,exaggerate){
 var ctx=cv.getContext("2d");
 if(!ctx)return false;
 var W=cv.width,H=cv.height;
 var tone=pickR(frng,["#f2d7c4","#e8b98f","#c98d5e","#a06a42"]);
 var hw=52+frng()*14,hh=60+frng()*12;
 var eyeDX=20+frng()*8,eyeY=78+frng()*8,eyeR=(emotion==="surprised"||emotion==="fearful")?11:8;
 var browY=eyeY-24,mouthY=128+frng()*8;
 var ex=exaggerate?1.6:1;
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle=tone;ctx.strokeStyle="rgba(0,0,0,.25)";ctx.lineWidth=3;
 ctx.beginPath();ctx.ellipse(90,95,hw,hh,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 /* eyes */
 [-1,1].forEach(function(s){
  var exx=90+s*eyeDX;
  ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(exx,eyeY,eyeR,eyeR*1.25,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle="#222";ctx.beginPath();ctx.arc(exx,eyeY+1,eyeR*0.45,0,Math.PI*2);ctx.fill();
 });
 /* brows */
 ctx.strokeStyle="#3a2a1a";ctx.lineWidth=5;ctx.lineCap="round";
 function brow(s,innerDy,outerDy){
  var x1=90+s*eyeDX-s*(eyeR+4),x2=90+s*eyeDX+s*(eyeR+4);
  var yOuter=browY+outerDy*ex,yInner=browY+innerDy*ex;
  ctx.beginPath();ctx.moveTo(x1,yOuter);ctx.lineTo(x2,yInner);ctx.stroke();
 }
 if(emotion==="angry"){brow(-1,10,-2);brow(1,10,-2);}
 else if(emotion==="sad"){brow(-1,-9,2);brow(1,-9,2);}
 else if(emotion==="surprised"||emotion==="fearful"){brow(-1,-4,-6);brow(1,-4,-6);}
 else{brow(-1,0,0);brow(1,0,0);}
 /* mouth */
 ctx.strokeStyle="#5a3a28";ctx.lineWidth=5;
 ctx.beginPath();
 if(emotion==="happy"){ctx.arc(90,mouthY-6,24*ex,0.15*Math.PI,0.85*Math.PI);}
 else if(emotion==="sad"){ctx.arc(90,mouthY+16,22*ex,1.15*Math.PI,1.85*Math.PI);}
 else if(emotion==="angry"){ctx.moveTo(90-22,mouthY+4);ctx.lineTo(90+22,mouthY+4);}
 else if(emotion==="surprised"){ctx.ellipse(90,mouthY+4,10*ex,14*ex,0,0,Math.PI*2);}
 else if(emotion==="fearful"){for(var x=0;x<=4;x++){var px=90-20+x*10,py=mouthY+(x%2?4:-4)*ex;if(x===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}}
 else{ctx.moveTo(90-20,mouthY);ctx.lineTo(90+20,mouthY);}
 ctx.stroke();
 return true;
}
function facesTrials(faces,opts,done){
 var i=0,correct=0;
 function trial(){
  if(i>=faces.length){done({trials:faces.length,correct:correct});return;}
  var f=faces[i];
  var labels=shuffleR(f.frng,FEMOTIONS.slice());
  setApp('<div class="card"><h2>'+(opts.tutorial?"Practice example — this does not count":"Face "+(i+1)+" of "+faces.length)+'</h2>'
  +'<div style="text-align:center"><canvas id="fc" width="180" height="190" style="max-width:100%"></canvas></div>'
  +'<p>Which expression is shown?</p>'
  +'<div style="text-align:center">'+labels.map(function(l){return '<button class="facebtn" data-e="'+l+'">'+l+'</button>';}).join("")+'</div>'
  +'<p id="fb" style="min-height:28px;font-weight:700"></p></div>');
  var cv=document.getElementById("fc");
  drawFace(cv,f.frng,f.emotion,opts.tutorial);
  var btns=app.querySelectorAll(".facebtn");
  for(var b=0;b<btns.length;b++)btns[b].addEventListener("click",function(e){
   var ans=e.currentTarget.getAttribute("data-e");
   var fb=document.getElementById("fb");
   if(opts.tutorial){
    if(ans===f.emotion){correct++;i++;setTimeout(trial,300);}
    else{tutRetry("faces");if(fb){fb.textContent="Not quite — look again and try.";fb.style.color="#dc2626";}}
   }else{
    if(ans===f.emotion)correct++;
    i++;setTimeout(trial,250);
   }
  });
 }
 trial();
}
TUT.faces=function(done){
 var frng=mulberry32(hashStr(S.seed+":faces-tut"));
 var faces=[{emotion:"happy",frng:mulberry32(hashStr(S.seed+":fh"))},{emotion:"sad",frng:mulberry32(hashStr(S.seed+":fs"))}];
 facesTrials(faces,{tutorial:true},function(){done();});
};
PLAY.faces=function(){
 var frng=gameRng("faces");
 var emos=shuffleR(frng,FEMOTIONS.concat(FEMOTIONS));
 var faces=emos.map(function(e,i){return{emotion:e,frng:mulberry32(hashStr(S.seed+":face"+i))};});
 facesTrials(faces,{tutorial:false},function(res){
  finishGame("faces",{trials:12,correct:res.correct,accuracy:Math.round(res.correct/12*100)});
 });
};
/* ================= results ================= */
function tbl(rows){
 return '<table class="metrics">'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join("")+'</table>';
}
function gameMetricsHTML(k,m){
 if(!m)return '<p class="small">No data.</p>';
 switch(k){
  case "balloons":return tbl([["Rounds","39"],["Total pumps",m.totalPumps],["Average pumps per balloon",m.avgPumps.toFixed(1)],["Explosions",m.pops+" / 39"],["Hypothetical money banked","$"+m.banked.toFixed(2)]])
   +'<p class="small">'+m.perColor.map(function(c){return c.color+": "+c.pumps+" pumps · "+c.pops+" pops · $"+c.banked.toFixed(2)+" banked";}).join("<br>")+'</p>';
  case "tower":return m.puzzles.map(function(p,i){return '<p><b>Puzzle '+(i+1)+':</b> '+p.moves+' moves <span class="small">(fewest possible: '+p.optimal+')</span><br><span class="small">Completion time: '+Math.round(p.secs)+'s · Time before first move: '+p.firstMoveS+'s</span></p>';}).join("");
  case "money":return tbl([["Sent","$"+m.sent],["Returned","$"+m.returned],["Fairness rating",m.fairness+" / 10"]]);
  case "sharing":return tbl([["Gave","$"+m.gave],["Kept","$"+m.kept],["Fairness rating",m.fairness+" / 10"]]);
  case "keypress":return tbl([["Hits",m.hits+" / "+m.trials],["Misses",m.misses],["False alarms",m.falseAlarms],["Premature responses",m.premature],["Median reaction time",m.medianRT+" ms"],["Mean reaction time",m.meanRT+" ms"]]);
  case "easyhard":return tbl([["Rounds","6"],["Easy tasks chosen",m.easyChosen],["Hard tasks chosen",m.hardChosen],["Solved correctly",m.correct+" / 6"],["Hypothetical money earned","$"+m.earned]]);
  case "digits":return tbl([["Longest sequence reversed",m.longestSpan+" digits"],["Sequences correct",m.totalCorrect],["Errors",m.errors]]);
  case "stop":return tbl([["Withhold target",m.target],["Correct responses",m.hits+" / "+m.trials],["Missed responses",m.misses],["False alarms",m.falseAlarms],["Correct withholds",m.correctInhibitions],["Premature responses",m.premature],["Median reaction time",m.medianRT+" ms"],["Mean reaction time",m.meanRT+" ms"]]);
  case "arrows":return tbl([["Rule used",m.rule],["Correct",m.correct+" / "+m.trials],["Accuracy",m.accuracy+"%"],["Median reaction time",m.medianRT+" ms"],["Mean reaction time",m.meanRT+" ms"],["Accuracy — matching trials",m.congruentAccuracy+"%"],["Accuracy — conflicting trials",m.incongruentAccuracy+"%"],["Premature responses",m.premature]]);
  case "lengths":return tbl([["Rule used","tap the "+m.rule+" line"],["Correct",m.correct+" / "+m.trials],["Accuracy",m.accuracy+"%"],["Median reaction time",m.medianRT+" ms"],["Mean reaction time",m.meanRT+" ms"],["Hypothetical money earned","$"+m.earned.toFixed(2)]]);
  case "cards":return tbl([["Cards picked","40"],["Final total","$"+m.finalTotal],["Picks — deck A / B / C / D",m.picksPerDeck.join(" / ")],["Decks that were better in the long run",m.goodDecks],["Better-deck picks — first 20",m.goodEarly+" / 20"],["Better-deck picks — last 20",m.goodLate+" / 20"]]);
  case "faces":return tbl([["Correct",m.correct+" / "+m.trials],["Accuracy",m.accuracy+"%"]]);
 }
 return "";
}
function mechFeedbackHTML(){
 var out=[];
 var prem=0,miss=0;
 ["keypress","stop","arrows"].forEach(function(k){if(S.metrics[k])prem+=S.metrics[k].premature||0;});
 ["keypress","stop"].forEach(function(k){if(S.metrics[k])miss+=S.metrics[k].misses||0;});
 if(prem>=3)out.push('<div class="tipbox">You made several <b>premature responses</b> ('+prem+'). On the real assessment, wait until the actual signal appears.</div>');
 if(miss>=4)out.push('<div class="tipbox">You missed several target signals ('+miss+'). Make sure you are rested and distraction-free for the real assessment.</div>');
 Object.keys(S.tutRetries).forEach(function(k){
  if(S.tutRetries[k]>=3)out.push('<div class="tipbox">You needed several tries on the practice example for <b>'+GTITLES[k]+'</b>. Read every qualifier before starting the real game.</div>');
 });
 return out.join("");
}
function renderResults(rec,live){
 setHeader("Practice results",100);
 var intStatus=rec.interruptions===0?"<b>Uninterrupted</b>":"<b>Interrupted — "+rec.interruptions+" game(s) restarted</b>";
 var games=rec.order||GKEYS;
 var perGame=games.map(function(k){
  var m=rec.metrics[k];
  var t=rec.gameTimes&&rec.gameTimes[k]?'<p class="small">Game time: '+fmtT(rec.gameTimes[k])+'</p>':"";
  return '<div class="card"><h3>'+GTITLES[k]+'</h3>'+gameMetricsHTML(k,m)+t+'<p class="small"><i>'+INVOLVED[k]+'</i></p></div>';
 }).join("");
 var mech=live?mechFeedbackHTML():"";
 setApp('<div class="card"><h1>Practice results</h1>'
 +'<p class="small">Objective practice metrics only — descriptive, not scores. This simulator does not reproduce Harver/Pymetrics scoring.</p>'
 +'<div class="resultbox">Run: <b>'+rec.dateStr+'</b> · Total session time: <b>'+fmtT(rec.totalS)+'</b><br>'+intStatus+'</div>'
 +mech+'</div>'
 +perGame
 +'<div class="card"><div class="readbox"><p class="rh">READ THE FULL INSTRUCTION — EVERY TIME</p>'
 +'<p>The real assessment may use <b>different rules</b> than this simulator.</p>'
 +'<p><b>Do not assume anything based on this practice.</b></p>'
 +'<div class="exbox"><p style="margin:0">If the instruction says <span class="exred">RED</span> <span class="exsmall">circle</span>, <b>both</b> details matter.</p></div>'
 +'<p>Watch carefully for <b>ONLY, EXCEPT, NOT, BEFORE, AFTER</b>, colors, shapes, capitalization and rule changes.</p></div></div>'
 +'<div class="card"><h2>You are ready for the real assessment.</h2>'
 +'<p>You have now experienced multiple styles of game-based tasks. You know what it feels like to switch rules, react under time pressure, inhibit responses, remember information and learn from uncertain feedback.</p>'
 +'<p><b>For the real Blackstone assessment:</b></p><ul>'
 +'<li>read every instruction slowly,</li><li>pay attention to every word,</li>'
 +'<li>do not assume the real game follows these rules,</li><li>do not try to guess the desired personality,</li>'
 +'<li>respond naturally,</li><li>stay consistent,</li><li>do it rested,</li>'
 +'<li>eliminate interruptions,</li><li>finish it in one sitting.</li></ul>'
 +'<p><b>There is no need to keep practicing repeatedly. Familiarity was the goal.</b></p></div>'
 +'<div class="card"><details><summary>About these practice-game formats</summary>'
 +'<p class="small">Many of these game types are loosely inspired by established cognitive/behavioral research tasks — for example, balloon risk tasks (Lejuez et al., 2002), Tower of London planning tasks (Shallice, 1982), flanker interference tasks (Eriksen &amp; Eriksen, 1974), card-deck learning tasks in the tradition of the Iowa Gambling Task (Bechara et al., 1994), digit-span memory tasks, and trust/dictator economic games (Berg, Dickhaut &amp; McCabe, 1995).</p>'
 +'<p class="small">This simulator <b>does not reproduce validated psychometric instruments</b>, Harver/Pymetrics games, or any employer\'s scoring model. It exists only to remove the surprise factor.</p></details>'
 +'<p class="small">Candidate data and retesting rules are governed by the assessment provider and employer. Follow the instructions in your Blackstone invitation.</p>'
 +'<p class="small">🔒 Your practice results remain on this device. They are not sent to Blackstone, Harver/Pymetrics, ChatGPT or any employer.</p></div>'
 +'<div class="card" style="text-align:center">'
 +(live?'<button class="primary" id="b-copy">Copy results summary</button> ':"")
 +'<button id="b-hist2">Past runs</button> '
 +(live?'<button id="b-del">Delete saved results</button> ':"")
 +'<button class="primary" id="b-new">Start a new run</button>'
 +'<p class="small" id="copied"></p></div>');
 if(live){
  on("b-copy","click",function(){copySummary(rec);});
  on("b-del","click",confirmDelete);
 }
 on("b-hist2","click",historyScreen);
 on("b-new","click",startScreen);
}
function showResults(){
 var totalS=(Date.now()-S.t0)/1000;
 var now=new Date();
 var dateStr=now.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
 var rec={d:now.toISOString().slice(0,10),dateStr:dateStr,seed:S.seed,tpl:S.tpl,order:S.order.slice(),totalS:Math.round(totalS),
  interruptions:S.interruptions,interruptedKeys:S.interruptedKeys.slice(),metrics:S.metrics,gameTimes:{},tutRetries:S.tutRetries};
 GKEYS.forEach(function(k){if(S.times[k]&&S.times[k].end)rec.gameTimes[k]=Math.round((S.times[k].end-S.times[k].start)/1000);});
 var runs=getRuns();runs.push(rec);
 try{localStorage.setItem("bgp_runs2",JSON.stringify(runs.slice(-20)));}catch(e){}
 renderResults(rec,true);
 window._lastRec=rec;
}
function summaryText(rec){
 var L=["Behavioral Games Practice — objective practice summary ("+rec.dateStr+")","Total session time: "+fmtT(rec.totalS),(rec.interruptions===0?"Uninterrupted":"Interrupted — "+rec.interruptions+" game(s) restarted"),""];
 (rec.order||GKEYS).forEach(function(k){
  var m=rec.metrics[k];if(!m)return;
  L.push("== "+GTITLES[k]+" ==");
  var tmp=document.createElement("div");tmp.innerHTML=gameMetricsHTML(k,m);
  var rows=tmp.querySelectorAll("tr");
  for(var i=0;i<rows.length;i++){var tds=rows[i].querySelectorAll("td");L.push(tds[0].textContent+": "+tds[1].textContent);}
  var ps=tmp.querySelectorAll("p");
  for(var j=0;j<ps.length;j++){var t=ps[j].textContent.trim();if(t)L.push(t);}
  L.push("");
 });
 L.push("Familiarization only — not Harver/Pymetrics scoring.");
 return L.join("\n");
}
function copySummary(rec){
 var txt=summaryText(rec);
 function done(){var c=document.getElementById("copied");if(c)c.textContent="Copied — you can paste it anywhere.";}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallback();});}
 else fallback();
 function fallback(){
  setApp('<div class="card"><h2>Copy your results</h2><textarea class="copyarea" id="ta">'+esc(txt)+'</textarea><p class="small">Select all and copy manually.</p><button class="primary" id="b-back">Back to results</button></div>');
  var ta=document.getElementById("ta");ta.focus();ta.select();
  on("b-back","click",function(){renderResults(window._lastRec,true);});
 }
}
/* ================= history ================= */
function historyScreen(){
 setHeader("Past runs",100);
 var runs=getRuns();
 if(!runs.length){setApp('<div class="card"><h2>Past runs</h2><p>No practice runs saved on this device yet.</p><button class="primary" id="b-back">Back</button></div>');on("b-back","click",startScreen);return;}
 var items=runs.map(function(r,i){
  var prem=0;Object.keys(r.metrics||{}).forEach(function(k){prem+=((r.metrics[k]||{}).premature||0);});
  var mech=prem>0?'<br><span class="small">Premature responses: '+prem+'</span>':"";
  return '<div class="resultbox"><b>Run — '+esc(r.dateStr||r.d)+'</b><br><span class="small">'+fmtT(r.totalS||0)+' total · '+(r.interruptions===0?"Uninterrupted":"Interrupted — "+r.interruptions+" restarted")+mech+'</span><br><button id="v'+i+'">View details</button></div>';
 }).reverse().join("");
 setApp('<div class="card"><h2>Past runs</h2><p class="small">Stored on this device only. No trait comparisons — just when you ran and basic mechanical notes.</p>'
 +items+'<div style="margin-top:12px"><button class="primary" id="b-back">Back</button> <button id="b-del2">Delete saved results</button></div></div>');
 runs.forEach(function(r,i){on("v"+i,"click",function(){renderResults(r,false);});});
 on("b-back","click",startScreen);
 on("b-del2","click",confirmDelete);
}
function confirmDelete(){
 setApp('<div class="overlay"><div class="card"><h2>Delete saved results?</h2><p>This removes completed run results stored on this device. It does not reset the anti-repeat question/test rotation.</p><button id="b-yes" style="border-color:#dc2626;color:#dc2626">Yes, delete everything</button> <button class="primary" id="b-no">Cancel</button></div></div>');
 on("b-yes","click",function(){try{localStorage.removeItem("bgp_runs2");}catch(e){}startScreen();});
 on("b-no","click",function(){if(window._lastRec)renderResults(window._lastRec,true);else startScreen();});
}
